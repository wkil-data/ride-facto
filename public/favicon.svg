<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="rf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="rf-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF6600" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#rf-bg)" stroke="#FF6600" stroke-width="2.5" />
  
  <!-- Subtle Racing Grid Hatch / Apex Notch -->
  <path d="M48 6L58 16" stroke="#262626" stroke-width="2" stroke-linecap="round" />
  <path d="M52 6L60 14" stroke="#262626" stroke-width="1.5" stroke-linecap="round" />

  <!-- Iconic 'RF' Speed Geometry -->
  <g filter="url(#glow)">
    <!-- Slanted R Leg & Backbone -->
    <path d="M14 49L21 15H36C42.5 15 46.5 18.5 45.5 24C44.8 28 41.5 30.5 37 31.5L46 49H36.5L29 33.5H23.5L20.5 49H14Z" fill="#F5F5F2" />
    <!-- Orange Racing Slash / Inner R Notch -->
    <path d="M25 21L23.5 28H33C35.5 28 37 26.8 37.5 24.5C38 22.2 36.8 21 34.2 21H25Z" fill="#0D0D0D" />
    <!-- Dynamic Factory Accent Slash (F & Apex) -->
    <path d="M37 15L33.5 28L43 28L44.5 23H49L51 15H37Z" fill="url(#rf-orange)" />
    <!-- Speed Slash Bar -->
    <polygon points="12,51 52,51 50,47 10,47" fill="url(#rf-orange)" />
  </g>
</svg>
